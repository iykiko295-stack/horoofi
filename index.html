<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>حروفي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Noto+Naskh+Arabic:wght@500;700&family=Playpen+Sans:wght@500;700&display=swap">
<style>
/* Layout: a one-screen iPad app with three levels of screen.
   Hub = the حروفي badge in the middle with the eight sections around it, each reached along a dotted tracing line
   (Arabic sections on top, English ones below, shapes and animals either side).
   Section = a shelf of pastel tiles. Trace = a white notebook page with a blue baseline beside a side panel
   (level, picture, extra facts) that drops below the page in portrait.
   Deliberately light-only: it is a paper notebook. */
:root{
  --ground:#F2F6FA;      /* app background, pale sky */
  --paper:#FFFFFF;       /* the notebook page and cards */
  --ink:#1D3146;         /* text */
  --ink-soft:#5E7286;    /* secondary text */
  --track:#E0E7EF;       /* the road a finger follows */
  --guide:#98AABD;       /* dotted centre line and arrows */
  --rule:#9CCBF2;        /* notebook baseline */
  --gold:#FFB400;        /* earned stars */
  --line:#E4EAF1;        /* hairlines and empty stars */
  --danger:#C2362F;
  --scrim:rgba(29,49,70,.34);
  --shadow:0 1px 2px rgba(29,49,70,.06),0 10px 26px rgba(29,49,70,.08);
  --font-ui:"Baloo Bhaijaan 2","Geeza Pro","SF Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --font-book:"Noto Naskh Arabic","Geeza Pro","Times New Roman",serif;
  --font-latin:"Playpen Sans","Baloo Bhaijaan 2","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --lc:#F0524B;          /* colour of the open item (set per item) */
  --lt:#FFE6E4;          /* its tint */
  color-scheme:light;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--ground);color:var(--ink);font-family:var(--font-ui);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--lc);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.screen{flex:1;min-height:0;display:flex;flex-direction:column}
svg{display:block}
.grow{flex:1}

.btn{height:56px;min-width:56px;border:0;border-radius:18px;background:var(--paper);box-shadow:var(--shadow);flex:none;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;font-weight:700;font-size:18px;color:var(--ink)}
.btn.icon{padding:0}
.btn.primary{background:var(--lc);color:#fff}
.btn:active{transform:scale(.95)}
.btn svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip{display:inline-flex;align-items:center;gap:6px;height:52px;padding:0 16px;border-radius:16px;background:var(--paper);box-shadow:var(--shadow);
  font-weight:700;font-size:19px;color:var(--ink);flex:none;font-variant-numeric:tabular-nums}
.chip svg{width:24px;height:24px;fill:var(--gold)}
.chip small{font-size:15px;color:var(--ink-soft);font-weight:600}

/* ---------- hub ---------- */
.hub-top{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px 0;max-width:1220px;width:100%;margin-inline:auto}
.hub-brand{display:none;margin:0 0 0 auto;font-size:30px;line-height:1;font-weight:800;letter-spacing:0}
.hub{flex:1;min-height:0;position:relative;display:grid;gap:24px 40px;padding:4px 24px 22px;max-width:1260px;width:100%;margin-inline:auto;
  grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:minmax(0,1fr) minmax(0,1.16fr) minmax(0,1fr);
  grid-template-areas:"o0 o1 o2" "o3 badge o4" "o5 o6 o7"}
#hubLines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.cn{fill:none;stroke-width:5;stroke-linecap:round;stroke-dasharray:.01 13}
.cn-tip{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.badge{grid-area:badge;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-inline:6px;min-height:0}
.disc{width:clamp(84px,13.5vh,150px);aspect-ratio:1;flex:none;border-radius:50%;background:var(--paper);display:grid;place-items:center;
  box-shadow:0 2px 4px rgba(29,49,70,.06),0 16px 40px rgba(29,49,70,.12)}
.disc svg{width:66%;height:66%}
.lg{fill:none;stroke:#F0524B;stroke-width:40;stroke-linecap:round;stroke-linejoin:round}
.lg-dots{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-dasharray:.01 19}
.lg-pen{fill:#fff;stroke:#F0524B;stroke-width:8}
.badge h1{margin:4px 0 0;font-size:clamp(24px,3.9vh,44px);line-height:1;font-weight:800;letter-spacing:0}
.opt{position:relative;z-index:1;min-height:0;min-width:0;border:0;border-radius:30px;background:var(--t);color:var(--c);
  display:flex;flex-direction:column;gap:4px;padding:12px 18px 12px;box-shadow:inset 0 -6px 0 rgba(29,49,70,.06);text-align:start}
.opt:active{transform:scale(.97)}
.opt .pv{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:5%;padding-block:4px}
.opt .pv svg{height:100%;max-height:150px;width:auto;max-width:30%}
.opt .pv.one svg{max-width:86%}
.opt .pv.two svg{max-width:44%}
.pv path,.tl path{fill:none;stroke:currentColor;stroke-width:34;stroke-linecap:round;stroke-linejoin:round}
.pv circle,.tl circle{fill:currentColor}
.opt .lab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.opt .lab b{display:block;font-size:clamp(20px,3.1vh,30px);line-height:1.1;font-weight:800;color:var(--ink)}
.opt .lab span{font-size:15px;font-weight:600;color:var(--ink-soft)}
.got{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:17px;color:var(--ink);background:rgba(255,255,255,.72);
  border-radius:12px;padding:3px 10px 1px;font-variant-numeric:tabular-nums;flex:none}
.got svg{width:18px;height:18px;fill:var(--gold)}

/* ---------- section ---------- */
.cat-top{display:flex;align-items:center;gap:12px;padding:16px 24px 8px;max-width:1160px;width:100%;margin-inline:auto}
.ctitle{display:flex;align-items:center;gap:12px;min-width:0}
.ctitle .ci{width:56px;height:56px;border-radius:18px;background:var(--t);color:var(--c);display:grid;place-items:center;flex:none}
.ctitle .ci svg{width:78%;height:78%}
.ctitle h1{margin:0;font-size:30px;line-height:1.05;font-weight:800;letter-spacing:0}
.ctitle span{font-size:15px;color:var(--ink-soft);font-weight:600}
.shelf{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 24px 24px;display:flex;flex-direction:column}
.tiles{--cols:7;--gap:14px;display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:var(--gap);max-width:1112px;width:100%;margin:auto}
.tiles[data-cat="words"],.tiles[data-cat="numbers"],.tiles[data-cat="ewords"],.tiles[data-cat="enumbers"]{--cols:5}
.tiles[data-cat="shapes"],.tiles[data-cat="animals"]{--cols:6}
.tiles[data-cat="words"],.tiles[data-cat="shapes"],.tiles[data-cat="ewords"],.tiles[data-cat="animals"]{flex:1;min-height:0;margin:0 auto;grid-auto-rows:minmax(0,1fr)}
.tiles[data-cat="words"] .tile,.tiles[data-cat="shapes"] .tile,.tiles[data-cat="ewords"] .tile,.tiles[data-cat="animals"] .tile{aspect-ratio:auto;min-height:0;overflow:hidden}
.case{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);box-shadow:var(--shadow);border-radius:18px;padding:4px;flex:none}
.case button{border:0;border-radius:14px;background:transparent;min-width:76px;height:48px;padding:0 14px;font-family:var(--font-latin);font-size:24px;font-weight:700;color:var(--ink-soft);line-height:1}
.case button[aria-pressed="true"]{background:var(--t);color:var(--c)}
.lt{font-family:var(--font-latin)}
.tile{position:relative;aspect-ratio:1/1.08;min-width:0;border:0;border-radius:26px;background:var(--t);color:var(--c);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 6px 10px;
  box-shadow:inset 0 -5px 0 rgba(29,49,70,.05);transition:transform .15s ease}
.tile:active{transform:scale(.94)}
.tile .tl{width:84%;flex:1;min-height:0}
.tile .nm{font-size:clamp(13px,1.5vw,18px);font-weight:700;line-height:1.15;color:var(--ink)}
.tile .nm.lt{font-weight:500}
.tile .em{font-size:clamp(17px,1.9vw,24px);line-height:1.15}
.pips{display:flex;gap:3px}
.pips svg{width:13px;height:13px;fill:rgba(29,49,70,.12)}
.pips svg.on{fill:var(--gold)}

/* ---------- trace ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:14px 20px 10px}
.title{display:flex;align-items:center;gap:12px;min-width:0}
.title .gl{width:56px;height:56px;border-radius:18px;background:var(--lt);color:var(--lc);display:grid;place-items:center;flex:none}
.title .gl svg{width:80%;height:80%}
.title .tx{display:flex;flex-direction:column;min-width:0}
.title b{font-size:26px;line-height:1.05;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:15px;color:var(--ink-soft);font-weight:600}
.title b.lt{font-weight:700;font-size:28px}
.group{display:flex;gap:10px}
.desk{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,25vw,320px);gap:18px;padding:4px 20px 20px}
.page{position:relative;min-height:0;background:var(--paper);border-radius:34px;box-shadow:var(--shadow);overflow:hidden}
#board{position:absolute;inset:0;width:100%;height:100%;touch-action:none;overflow:visible}
.hint{position:absolute;top:14px;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);
  padding:7px 18px 5px;border-radius:999px;background:var(--lt);color:var(--lc);font-weight:700;font-size:19px;line-height:1.3;pointer-events:none;text-align:center}
.hint.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:scale(1)}}
.side{display:flex;flex-direction:column;gap:14px;min-height:0;overflow-y:auto}
.card{background:var(--paper);border-radius:24px;box-shadow:var(--shadow);padding:14px 16px 16px;min-width:0}
.card h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--ink-soft);letter-spacing:0}
.levels{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.lvl{border:0;border-radius:16px;background:var(--ground);padding:9px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--ink-soft);font-weight:700;font-size:14px;line-height:1.15;min-width:0}
.lvl[aria-pressed="true"]{background:var(--lt);color:var(--lc);box-shadow:inset 0 0 0 2.5px var(--lc)}
.lvl .mini{width:44px;height:24px;max-width:100%}
.mini .fr{fill:none;stroke:var(--guide);stroke-width:3;stroke-linecap:round}
.mini .dl{fill:none;stroke:var(--guide);stroke-width:1.8;stroke-linecap:round;stroke-dasharray:.01 3.6}
.mini .dl.big{stroke-width:2.8;stroke-dasharray:.01 4.6}
.mini .hd{fill:none;stroke:var(--guide);stroke-width:3.4;stroke-linecap:round}
.lvl[aria-pressed="true"] .mini .hd,.lvl[aria-pressed="true"] .mini .dl{stroke:var(--lc)}
.lvl[aria-pressed="true"] .mini .fr{stroke:var(--lc)}
.mini .t{fill:none;stroke:var(--track);stroke-linecap:round}
.lvl[aria-pressed="true"] .mini .t{stroke:var(--lc);opacity:.35}
.mini .s{fill:var(--paper);stroke:var(--lc);stroke-width:2.4}
.lvl .st{width:16px;height:16px;fill:var(--line)}
.lvl .st.on{fill:var(--gold)}
.word{display:flex;align-items:center;gap:14px}
.word .pic{font-size:58px;line-height:1;flex:none;width:76px;height:76px;display:grid;place-items:center;border-radius:20px;background:var(--lt)}
.word .w{font-family:var(--font-book);font-size:42px;line-height:1.5;font-weight:700;color:var(--ink);min-width:0}
.word .w.ui{font-family:var(--font-ui);font-size:32px;line-height:1.2;font-weight:800}
.word .w .hl{color:var(--lc)}
.voiced .say{cursor:pointer}
.forms{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.form{display:flex;flex-direction:column;align-items:center;border-radius:14px;background:var(--ground);padding:4px 2px 6px}
.form .f{font-family:var(--font-book);font-size:34px;line-height:1.6;font-weight:700;color:var(--lc)}
.form .l{font-size:13px;color:var(--ink-soft);font-weight:600;line-height:1}
.form.off{opacity:.35}
.spell{display:flex;flex-wrap:wrap;gap:8px}
.spell span{min-width:58px;height:62px;padding:0 10px;border-radius:16px;background:var(--t);color:var(--c);display:grid;place-items:center;
  font-family:var(--font-book);font-size:36px;font-weight:700;line-height:1}
.spell.lt span{font-family:var(--font-latin);font-size:34px;font-weight:500;padding-bottom:4px}
.word .w.lt{font-family:var(--font-latin);font-size:36px;line-height:1.3;font-weight:500}
.word .w .en{display:block;font-family:var(--font-latin);font-size:20px;line-height:1.2;font-weight:500;color:var(--ink-soft)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pair .form .f{font-family:var(--font-latin);font-size:40px;line-height:1.4;font-weight:500}
.pair .form.cur{background:var(--lt);box-shadow:inset 0 0 0 2.5px var(--lc)}
.count .cn.lt{font-family:var(--font-latin);font-weight:500}
.count .cn{display:block;font-family:var(--font-book);font-size:34px;line-height:1.5;font-weight:700;margin-bottom:4px}
.objs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;font-size:28px;line-height:1.25;text-align:center}
.objs.zero{display:flex;align-items:center;gap:12px;font-size:40px}
.objs.zero small{font-size:18px;color:var(--ink-soft);font-weight:700}
.seq{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;font-weight:800;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.seq b{width:66px;height:66px;border-radius:18px;background:var(--lt);color:var(--lc);display:grid;place-items:center;font-size:44px;padding-top:6px}
.seq span{width:46px;text-align:center}
.ex{display:flex;gap:10px;font-size:42px;line-height:1.2}
.ex span{flex:1;min-width:0;height:70px;border-radius:18px;background:var(--ground);display:grid;place-items:center}

/* win sheet */
.win{position:absolute;inset-inline:16px;bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 16px;border-radius:26px;background:var(--paper);box-shadow:0 12px 40px rgba(29,49,70,.18);
  transform:translateY(130%);transition:transform .45s cubic-bezier(.34,1.4,.64,1)}
.win.show{transform:translateY(0)}
.win .msg{flex:1;min-width:160px}
.win .msg b{display:block;font-size:30px;line-height:1.1;font-weight:800;color:var(--lc)}
.win .msg span{font-size:16px;color:var(--ink-soft);font-weight:600}
.win .stars{display:flex;gap:4px}
.win .stars svg{width:34px;height:34px;fill:var(--line)}
.win .stars svg.on{fill:var(--gold)}
.win .stars svg.new{animation:starIn .7s cubic-bezier(.34,1.56,.64,1)}
@keyframes starIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.win .acts{display:flex;gap:10px}

/* drawing layers */
.rule{stroke:var(--rule);stroke-width:2;vector-effect:non-scaling-stroke}
.rule-mid{stroke-dasharray:9 9}
.trk{fill:none;stroke:var(--track);stroke-linecap:round;stroke-linejoin:round}
.trk-dot{fill:var(--track)}
.gd{fill:none;stroke:var(--guide);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:.01 9.5}
.gd-dot{fill:none;stroke:var(--guide);stroke-width:3;stroke-linecap:round;stroke-dasharray:.01 6.6}
.noguide .gd,.noguide .gd-dot{display:none}
.arrow{fill:none;stroke:var(--guide);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.arrow.first{stroke:var(--lc);stroke-width:4.4}
.fl{fill:none;stroke:var(--lc);stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.fl.flash{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:.55}100%{opacity:1}}
.fl-dot{fill:var(--lc);transform:scale(0);transform-box:fill-box;transform-origin:center;transition:transform .28s cubic-bezier(.34,1.7,.64,1)}
.fl-dot.on{transform:scale(1)}
.ring{fill:none;stroke:var(--lc);stroke-width:3.5;transform-box:fill-box;transform-origin:center;animation:ring 1.5s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.75}100%{transform:scale(2);opacity:0}}
.sdot{fill:var(--paper);stroke:var(--lc);stroke-width:4}
.snum{font-family:var(--font-ui);font-weight:800;font-size:18px;fill:var(--lc);text-anchor:middle;dominant-baseline:central}
.pen{fill:var(--paper);stroke:var(--lc);stroke-width:4.5;pointer-events:none}
.ghost{fill:var(--lc);pointer-events:none}
.start.shake{animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#itemG.bounce{animation:bounce .75s cubic-bezier(.34,1.56,.64,1);transform-box:fill-box;transform-origin:50% 60%}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.07)}60%{transform:scale(.98)}100%{transform:scale(1)}}
.demo #board{pointer-events:none}
/* free writing: nothing to follow, the child's own ink */
.free .trk,.free .trk-dot,.free .gd,.free .gd-dot,.free .arrow{display:none}
.noshade .trk,.noshade .trk-dot{display:none}
.noarrows .arrow{display:none}
.dotsonly .gd{stroke-width:5.4;stroke-dasharray:.01 12}
.dotsonly .gd-dot{stroke-width:4.4;stroke-dasharray:.01 8}
.dotsonly .arrow{stroke-width:4}
.hint-start{animation:helpfade 1.8s ease-out forwards}
@keyframes helpfade{0%,55%{opacity:1}100%{opacity:0}}
.ink{fill:none;stroke:var(--lc);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.cmp path{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:7 7;stroke-linecap:round;vector-effect:non-scaling-stroke;opacity:.55}
.cmp circle{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:4 4;vector-effect:non-scaling-stroke;opacity:.55}
.model{position:absolute;bottom:16px;inset-inline-start:16px;width:clamp(74px,11vw,108px);aspect-ratio:1;border-radius:20px;background:var(--lt);color:var(--lc);
  display:grid;place-items:center;padding:10px;pointer-events:none}
.model svg{width:100%;height:100%}
.done{position:absolute;bottom:18px;left:0;right:0;margin-inline:auto;width:max-content;height:62px;padding:0 28px;font-size:21px;border-radius:20px}

/* ---------- settings ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px}
.sheet{width:min(580px,100%);max-height:100%;overflow-y:auto;background:var(--paper);border-radius:30px;padding:20px 22px 16px;box-shadow:0 20px 60px rgba(29,49,70,.25)}
.sheet-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.sheet-head h2{margin:0;font-size:28px;font-weight:800;flex:1;letter-spacing:0}
.set-row{display:grid;gap:8px;padding-block:14px;border-top:1.5px solid var(--line)}
.set-row h3{margin:0;font-size:20px;line-height:1.2;font-weight:800}
.set-row p{margin:0;color:var(--ink-soft);font-size:15px;font-weight:600;line-height:1.35}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--ground);border-radius:18px;padding:5px}
.seg button{border:0;border-radius:14px;background:transparent;min-height:54px;font-weight:700;font-size:17px;line-height:1.2;padding:6px 10px;
  display:flex;align-items:center;justify-content:center;gap:8px;color:var(--ink-soft)}
.seg button svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(29,49,70,.08),0 4px 14px rgba(29,49,70,.1)}
.seg button[aria-pressed="true"] svg{stroke:#F0524B}
.reset-row{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding-top:12px;border-top:1.5px solid var(--line);color:var(--ink-soft);font-weight:700}
.text-btn{border:0;background:none;color:var(--ink-soft);font-weight:700;font-size:16px;padding:8px 12px;border-radius:12px;text-decoration:underline;text-underline-offset:4px}
.text-btn.danger{color:var(--danger)}

#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}

/* no animations: everything still works, nothing moves on its own */
.calm *,.calm *::before,.calm *::after{animation:none!important;transition:none!important}
.calm .ring{opacity:.45}

/* portrait (iPad upright, phones) */
@media (max-aspect-ratio:1/1){
  .hub{gap:26px 22px;grid-template-rows:repeat(3,minmax(0,1fr))}
  .disc{width:clamp(92px,15vh,150px)}
  .badge h1{font-size:clamp(28px,4.4vh,44px)}
  .opt{padding:16px 16px 14px}
  .opt .lab{flex-direction:column;align-items:flex-start;gap:6px}
  .shelf{display:flex;flex-direction:column}
  .tiles{flex:1;min-height:0;margin:0 auto;grid-auto-rows:minmax(92px,1fr)}
  .tiles .tile,.tiles[data-cat="words"] .tile{aspect-ratio:auto;min-height:0;overflow:hidden}
  .tiles[data-cat="letters"],.tiles[data-cat="words"],.tiles[data-cat="abc"],.tiles[data-cat="ewords"]{--cols:4}
  .tiles[data-cat="shapes"]{--cols:5}
  .tiles[data-cat="animals"]{--cols:3}
  .tiles[data-cat="numbers"],.tiles[data-cat="enumbers"]{--cols:3}
  .tiles[data-cat="numbers"] .tile:last-child,.tiles[data-cat="enumbers"] .tile:last-child{grid-column:2}
  .desk{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:grid;grid-template-columns:1.05fr 1fr 1.25fr;overflow:visible}
  .side .card{padding:12px 14px 14px}
  .word .pic{width:64px;height:64px;font-size:48px}
  .word .w{font-size:36px}
  .word .w.ui{font-size:28px}
}
@media (max-width:760px){
  .bar .btn .lbl{display:none}
  .bar .btn{padding:0;width:52px;height:52px;min-width:52px}
}
@media (max-width:900px){
  .bar{gap:8px;padding:12px 14px 8px}
  .group{gap:8px}
  .desk{padding:4px 14px 14px;gap:12px}
}
@media (max-width:640px){
  .hub-top{padding:12px 16px 0}
  .hub-brand{display:block}
  .hub{padding:6px 16px 16px;gap:12px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(4,minmax(0,1fr));
    grid-template-areas:"o0 o5" "o1 o6" "o2 o7" "o3 o4"}
  .badge,#hubLines{display:none}
  .opt .pv svg{max-height:96px}
  .opt{border-radius:24px;padding:12px 12px 10px}
  .opt .lab{flex-direction:column;align-items:flex-start;gap:4px}
  .opt .lab span{font-size:14px}
  .tiles{--gap:10px}
  .tiles[data-cat="words"],.tiles[data-cat="ewords"]{--cols:2;flex:none;grid-auto-rows:auto}
  .tiles[data-cat="words"] .tile,.tiles[data-cat="ewords"] .tile{aspect-ratio:1.45/1}
  .tiles[data-cat="shapes"],.tiles[data-cat="animals"]{--cols:3;flex:none;grid-auto-rows:auto}
  .tiles[data-cat="shapes"] .tile,.tiles[data-cat="animals"] .tile{aspect-ratio:1/1.05}
  .cat-top{flex-wrap:wrap;row-gap:10px}
  .cat-top .grow{display:none}
  .ctitle{flex:1;min-width:0}
  .ctitle h1{font-size:22px;line-height:1.15}
  .case{order:9;flex-basis:100%}
  .case button{height:44px;font-size:21px;padding:0 10px}
  .tile{border-radius:20px}
  .cat-top{padding:12px 16px 6px}
  .ctitle h1{font-size:24px}
  .ctitle .ci{width:46px;height:46px;border-radius:14px}
  .shelf{padding:8px 16px 20px}
  .chip{height:46px;font-size:17px;padding:0 12px}
  .title .gl{width:48px;height:48px}
  .title .tx{display:none}
  .bar .btn{width:44px;height:44px;min-width:44px;border-radius:14px}
  .bar .btn svg{width:22px;height:22px}
  .win .btn{height:48px;font-size:16px}
  .desk{display:flex;flex-direction:column;overflow-y:auto}
  .page{flex:none;aspect-ratio:1/1;width:100%;max-width:100%}
  .side{display:flex;flex-direction:column}
  .win .msg b{font-size:24px}
  .sheet{padding:16px 16px 12px;border-radius:24px}
  .seg button{font-size:15px;min-height:50px}
}
@media (prefers-reduced-motion:reduce){
  .ring{animation:none;opacity:.45}
  #itemG.bounce,.hint.pop,.win .stars svg.new{animation:none}
  .win{transition:none}
}

const Voice = {
  cache: {}, cur: null, token: 0,
  has(key) { return Object.prototype.hasOwnProperty.call(VOICE, key); },
  decode(key) {
    if (!this.cache[key]) {
      this.cache[key] = new Promise((res, rej) => {
        const bin = atob(VOICE[key]), bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        Sound.ctx.decodeAudioData(bytes.buffer, res, rej);
      });
      this.cache[key].catch(() => { delete this.cache[key]; });
    }
    return this.cache[key];
  },
  stop() {
    this.token++;
    if (this.cur) { try { this.cur.stop(); } catch (e) {} this.cur = null; }
  },
  async play(keys) {
    if (!store.sound || !Sound.ctx) return;
    this.stop();
    const tok = this.token;
    for (const k of keys) {
      if (!this.has(k)) continue;
      let buf;
      try { buf = await this.decode(k); } catch (e) { continue; }
      if (tok !== this.token) return;
      await new Promise(res => {
        const src = Sound.ctx.createBufferSource();
        src.buffer = buf; src.connect(Sound.ctx.destination);
        src.onended = res; this.cur = src; src.start();
      });
      if (tok !== this.token) return;
      await sleep(280);
    }
  }
};

/* ---------------- sparkles and confetti ---------------- */
const FX = {
  cv: $('fx'), ctx: null, parts: [], running: false, dpr: 1, last: 0,
  init() { this.ctx = this.cv.getContext('2d'); this.resize(); addEventListener('resize', () => this.resize()); },
  resize() {
    this.dpr = Math.min(window.devicePixelRatio || 1, 2);
    this.cv.width = Math.round(innerWidth * this.dpr); this.cv.height = Math.round(innerHeight * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  add(p) { this.parts.push(p); if (!this.running) { this.running = true; this.last = performance.now(); requestAnimationFrame(t => this.loop(t)); } },
  sparkle(x, y, color) {
    if (!moving()) return;
    for (let k = 0; k < 2; k++) this.add({ x, y, vx: (Math.random() - .5) * 3.4, vy: -Math.random() * 2.6 - .4, g: .06, life: 1, decay: .03 + Math.random() * .02,
      size: 4 + Math.random() * 5, color: Math.random() < .35 ? '#FFB400' : color, shape: 'star', rot: Math.random() * 6.3, vr: (Math.random() - .5) * .3 });
  },
  burst(x, y, n, colors) {
    if (!moving()) return;

  if (gained) { store.stars[it.id] = S.level; save(); }
  const praise = pick(PRAISE);
  setHint(praise);
  Sound.win();
  setTimeout(() => { if (S.mode === 'won') sayItem('all'); }, 500);
  if (moving()) { gItem.classList.remove('bounce'); void gItem.getBoundingClientRect(); gItem.classList.add('bounce'); }
  const r = pageEl.getBoundingClientRect();
  FX.burst(r.left + r.width / 2, r.top + r.height * 0.45, reduced ? 24 : 120, PALETTE.map(p => p[0]).concat(['#FFB400']));
  renderLevels();
  setTimeout(() => { if (S.mode === 'won') showWin(praise, gained); }, moving() ? 700 : 150);
}
function showWin(praise, gained) {
  const it = item(), earned = store.stars[it.id] || 0;
  $('winTitle').textContent = praise;
  $('winSub').textContent = gained ? (lv().free ? (INFO[cat().id].drawing ? 'ربحت نجمة الرسم الحر' : 'ربحت نجمة الكتابة الحرة') : `ربحت نجمة المستوى ${lv().long}`) : INFO[cat().id].done(it);
  $('winStars').innerHTML = LEVELS.map((L, i) => i + 1).map(k => `<svg viewBox="0 0 24 24" class="${k <= earned ? 'on' : ''}${gained && k === S.level ? ' new' : ''}">${STAR}</svg>`).join('');
  $('goLbl').textContent = S.level < NL - 1 ? 'المستوى التالي' : S.level === NL - 1 ? 'اكتب وحدك' : INFO[cat().id].next;
  winEl.hidden = false;
  requestAnimationFrame(() => requestAnimationFrame(() => winEl.classList.add('show')));
}
function hideWin() { winEl.classList.remove('show'); winEl.hidden = true; }
$('againBtn').addEventListener('click', () => { Sound.unlock(); resetProgress(); });
$('goBtn').addEventListener('click', () => {
  Sound.unlock();
  if (S.level < NL) { S.level++; renderLevels(); buildBoard(item()); resetProgress(); }
  else openItem(S.c, S.i + 1);
});

/* ---------------- demo: watch how it is written ---------------- */
async function playDemo() {
  if (S.mode === 'demo') return;
  resetProgress();
  const tok = ++S.demoToken;
  S.mode = 'demo'; traceEl.classList.add('demo');
  renderMarkers(); setHint(INFO[cat().id].drawing ? 'شاهد كيف نرسمه' : 'شاهد كيف نكتبه');
  const pen = mk('circle', { r: 12, class: 'pen' }, gMark);
  for (let k = 0; k < S.strokes.length; k++) {
    if (tok !== S.demoToken) return;
    S.cur = k;
    S.strokes.forEach((st, j) => { if (!st.dot) st.arrows.forEach(a => { a.style.display = j === k ? '' : 'none'; }); });
    const st = S.strokes[k];
    if (st.dot) {
      pen.setAttribute('cx', st.x); pen.setAttribute('cy', st.y);
      await sleep(420); if (tok !== S.demoToken) return;
      st.done = true; drawStroke(st); Sound.dot();
      await sleep(260); continue;
    }
    pen.setAttribute('r', st.penR + 1);
    const p0 = st.pts[0]; pen.setAttribute('cx', p0.x); pen.setAttribute('cy', p0.y);
    await sleep(260); if (tok !== S.demoToken) return;
    let ticks = 0;
    await animate(Math.max(700, st.len * 4.4), t => {
      if (tok !== S.demoToken) return false;
      st.prog = st.len * easeInOut(t); drawStroke(st);
      const p = st.fill.getPointAtLength(st.prog); pen.setAttribute('cx', p.x); pen.setAttribute('cy', p.y);
      const q = Math.floor(t * 8); while (ticks < q) { Sound.tick(ticks + k * 2); ticks++; }
    });
    if (tok !== S.demoToken) return;
    st.done = true; st.prog = st.len; drawStroke(st); Sound.stroke();
    await sleep(320);
  }
  if (tok !== S.demoToken) return;
  pen.remove(); setHint('والآن دورك!');
  await sleep(1100);
  if (tok !== S.demoToken) return;
  resetProgress(); setHint(`دورك! ابدأ من الرقم ${num(1)}`);
}

/* ---------------- idle hint: a soft dot glides along the path ---------------- */
setInterval(() => {
  if (S.screen !== 'trace' || S.mode !== 'trace' || S.tracing || !moving() || lv().free || lv().hidden) return;
  if (performance.now() - S.lastInput < 5000) return;
  S.lastInput = performance.now();
  const st = S.strokes[S.cur]; if (!st || st.dot) return;
  const c = mk('circle', { r: st.penR + 1, class: 'ghost' }, gMark);
  const s0 = st.prog, s1 = Math.min(st.len, s0 + 130);
  animate(1400, t => {
    const p = st.fill.getPointAtLength(s0 + (s1 - s0) * easeInOut(t));
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
    c.style.opacity = String(0.5 * Math.sin(Math.PI * t));
  }).then(() => c.remove());
}, 700);

/* ---------------- settings ---------------- */
function applySettings() {
  $('app').classList.toggle('calm', !store.motion);
  document.querySelectorAll('.seg').forEach(seg => {
    const v = store[seg.dataset.key] ? '1' : '0';
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  });
}
function resetRow(confirming) {
  const row = $('resetRow');
  row.innerHTML = confirming
    ? '<span>نمسح كل النجوم؟</span><button class="text-btn danger" type="button" data-r="yes">نعم، امسح</button><button class="text-btn" type="button" data-r="no">لا</button>'
    : '<button class="text-btn" type="button" data-r="ask">مسح كل النجوم والبدء من جديد</button>';
}
$('resetRow').addEventListener('click', e => {
  const b = e.target.closest('[data-r]'); if (!b) return;
  if (b.dataset.r === 'ask') resetRow(true);
  else if (b.dataset.r === 'yes') { store.stars = {}; store.seen = {}; save(); resetRow(false); renderHub(); }
  else resetRow(false);
});
document.querySelectorAll('.seg').forEach(seg => seg.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  Sound.unlock();
  store[seg.dataset.key] = b.dataset.v === '1'; save(); applySettings();
  if (seg.dataset.key === 'sound') { if (store.sound) Sound.dot(); else Voice.stop(); }
  if (seg.dataset.key === 'motion' && !store.motion) FX.clear();
}));
function openSettings() { resetRow(false); applySettings(); $('settings').hidden = false; $('setClose').focus(); }
function closeSettings() { $('settings').hidden = true; $('setBtn').focus(); }
$('setBtn').addEventListener('click', () => { Sound.unlock(); openSettings(); });
$('setClose').addEventListener('click', closeSettings);
$('settings').addEventListener('click', e => { if (e.target === $('settings')) closeSettings(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('settings').hidden) closeSettings(); });

/* ---------------- buttons ---------------- */
$('gridBtn').addEventListener('click', () => { Sound.unlock(); openCat(S.c, groupOf(cat(), S.i)); });
$('prevBtn').addEventListener('click', () => { Sound.unlock(); openItem(S.c, S.i - 1); });
$('nextBtn').addEventListener('click', () => { Sound.unlock(); openItem(S.c, S.i + 1); });
$('clearBtn').addEventListener('click', () => { Sound.unlock(); resetProgress(); });
$('demoBtn').addEventListener('click', () => { Sound.unlock(); playDemo(); });
$('sayBtn').addEventListener('click', () => { Sound.unlock(); sayItem('all'); });
$('tGlyph').addEventListener('click', () => { Sound.unlock(); sayItem(0); });
$('card2').addEventListener('click', e => { const s = e.target.closest('.say'); if (!s) return; Sound.unlock(); sayItem(+s.dataset.k); });

/* ---------------- start ---------------- */
FX.init();
applySettings();
buildHub();
openHub();
window.__huroufi = { S, CATS, LEVELS, openItem, openCat, openHub, store, Voice, applySettings, judgeInk, JUDGE };
})();
</script>
